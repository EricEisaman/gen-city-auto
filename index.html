  <body>
    <canvas id="view" tabindex="0"></canvas>
    <div id="loading">
      <div class="load-main">
        <div class="load-info">
          <div class="title">
            <div>gen&nbsp;&nbsp;</div>
            <div>&nbsp;&nbsp;city</div>
            <div>auto</div>
          </div>
          <div id="loadcity"></div>
          <div id="loadmsg">Starting…</div>
          <div class="bar"><div id="loadbar"></div></div>
          <div id="loaddetail"></div>
        </div>
        <div class="load-map"><canvas id="loadmap"></canvas></div>
      </div>
      <div id="loadtip"></div>
    </div>
    <div id="hud"></div>
    <div id="stats"></div>
    <div id="perf" style="display: none"></div>
    <div id="help"></div>
    <div id="toolbar">
      <button id="btn-cam" title="Camera (C)">📷</button>
      <button id="btn-veh" title="Car / helicopter (V)">🚁</button>
      <button id="btn-menu" title="Settings (M)">⚙</button>
    </div>
    <div id="menu" class="hidden"></div>
    <div id="errors"></div>
    <script type="module" src="main.js"></script>
  </body>
